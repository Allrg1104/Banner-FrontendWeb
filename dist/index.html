<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Académica Institucional</title>
    <meta name="description" content="Sistema de Gestión Académica y Analítica Predictiva">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- External Libs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <!-- Styles -->
  <script type="module" crossorigin src="/assets/index-D2UB5xPr.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-Byke6l7x.css">
</head>

<body class="antialiased font-sans">

    <!-- App Container -->
    <div id="app" class="min-h-screen flex flex-col">
        <!-- Placeholder para Vistas (SPA) -->
        <main id="main-content" class="flex-grow">
            <div class="flex items-center justify-center h-screen">
                <div class="loader"></div>
            </div>
        </main>
    </div>

    <!-- Modales Globales -->
    <div id="modal-container"
        class="hidden fixed inset-0 z-50 overflow-auto bg-black bg-opacity-50 flex items-center justify-center p-4">
        <div id="modal-content" class="bg-white rounded-2xl shadow-2xl max-w-lg w-full transform transition-all"></div>
    </div>

    <!-- Modal Universal de Servicios (Para Docentes) -->
    <div id="service-modal" class="hidden fixed inset-0 z-[70] bg-slate-900/80 backdrop-blur flex items-center justify-center p-4">
        <div class="bg-white rounded-[32px] max-w-2xl w-full max-h-[85vh] overflow-hidden flex flex-col shadow-2xl">
            <div class="p-8 border-b border-slate-100 flex justify-between items-center bg-white sticky top-0">
                <div><h3 id="svc-title" class="text-2xl font-black text-slate-900"></h3><p id="svc-desc" class="text-sm text-slate-500 mt-1"></p></div>
                <button onclick="document.getElementById('service-modal').classList.add('hidden')" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="svc-body" class="p-8 overflow-y-auto space-y-6"></div>
            <div id="svc-footer" class="p-6 bg-slate-50 border-t border-slate-100 flex justify-end">
                <button onclick="document.getElementById('service-modal').classList.add('hidden')" class="btn-premium btn-ghost">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed bottom-20 right-4 sm:bottom-4 sm:right-4 z-[9999] flex flex-col gap-2"></div>

    <!-- Custom Confirm Modal -->
    <div id="custom-confirm-modal" class="fixed inset-0 bg-[#032840]/80 backdrop-blur-sm z-[200] hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-[32px] w-full max-w-md p-8 shadow-2xl transform scale-95 transition-transform duration-300" id="custom-confirm-box">
            <div class="flex items-center justify-center w-16 h-16 rounded-full bg-red-50 mx-auto mb-6" id="custom-confirm-icon-bg">
                <i data-lucide="alert-triangle" class="w-8 h-8 text-red-500" id="custom-confirm-icon"></i>
            </div>
            <h3 class="text-xl font-black text-center text-[#032840] mb-2" id="custom-confirm-title">Confirmación Requerida</h3>
            <p class="text-sm text-center text-slate-500 font-medium mb-8" id="custom-confirm-message">¿Estás seguro de continuar con esta acción?</p>
            <div class="flex gap-4">
                <button id="custom-confirm-cancel" class="flex-1 py-4 rounded-2xl text-xs font-black uppercase tracking-widest text-slate-500 bg-slate-100 hover:bg-slate-200 transition-colors">Cancelar</button>
                <button id="custom-confirm-accept" class="flex-1 py-4 rounded-2xl text-xs font-black uppercase tracking-widest text-white bg-red-500 hover:bg-red-600 shadow-lg shadow-red-500/30 transition-all">Sí, Continuar</button>
            </div>
        </div>
    </div>

    <!-- Core App Scripts -->
    <script>window.Views = {};</script>

    <!-- Pre-visualización (puedes borrar esto luego) -->
    <style>
        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #E5E7EB;
            border-bottom-color: #2563EB;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</body>

</html>
